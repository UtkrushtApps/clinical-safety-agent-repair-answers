services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinical_agent
      POSTGRES_PASSWORD: clinical_dev_password
      POSTGRES_DB: clinical_trials
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_agent -d clinical_trials"]
      interval: 2s
      timeout: 3s
      retries: 30
